<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazie Boutique</title>

<div class="card">

<div class="card">

</div>

<div class="card">

</div>

</html>
